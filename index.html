<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor Slides Coro MCLE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFCC00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js?v=3').catch(err => console.log(err));
        });
      }
    </script>
</head>
<body class="bg-[#0c0c0c] text-gray-100 min-h-screen font-sans antialiased pb-24 md:pb-6">

    <header class="bg-[#141414] border-b border-gray-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-start">
                <div class="bg-[#FFCC00] text-black p-2.5 rounded-xl shadow-lg shadow-[#FFCC00]/10">
                    <i class="fa-solid :fa-cross text-xl md:text-2xl"></i>
                </div>
                <div class="text-center sm:text-left">
                    <h1 class="text-xl md:text-2xl font-black tracking-tight text-white">CORO MCLE</h1>
                    <p class="text-xs font-bold uppercase tracking-widest text-[#FFCC00]">Gestor de Slides • Múnich</p>
                </div>
            </div>
            
            <div class="flex flex-wrap gap-2 w-full sm:w-auto justify-center">
                <button onclick="importarCantosExterno()" class="flex-1 sm:flex-none bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-3 rounded-xl text-sm font-bold border border-gray-700 transition duration-200 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-file-import text-gray-400"></i> Importar .txt
                </button>
                <button onclick="guardarCantosTxt()" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-3 rounded-xl text-sm font-bold transition duration-200 shadow-lg shadow-emerald-600/20 active:scale-95 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar .txt
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-3 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6">
        
        <section class="lg:col-span-5 bg-[#141414] rounded-2xl border border-gray-800 p-4 shadow-xl flex flex-col max-h-[85vh] lg:max-h-[78vh]">
            <div class="mb-4">
                <h2 class="text-lg font-bold text-white mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-book text-[#FFCC00]"></i> Cantoral de la Misión
                </h2>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-base"></i>
                    <input type="text" id="buscador" oninput="filtrarCantos()" placeholder="Buscar por título o letra..." class="w-full bg-[#1c1c1c] border border-gray-700 rounded-xl pl-11 pr-4 py-3 text-base text-white placeholder-gray-500 focus:outline-none focus:border-[#FFCC00] focus:ring-2 focus:ring-[#FFCC00]/20 transition">
                </div>
            </div>

            <div id="lista-cantos" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar">
                </div>
        </section>

        <section class="lg:col-span-7 bg-[#141414] rounded-2xl border border-gray-800 p-4 shadow-xl flex flex-col max-h-[85vh] lg:max-h-[78vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-[#FFCC00]"></i> Orden de la Misa
                </h2>
                <button onclick="limpiarMisa()" class="text-xs font-bold uppercase tracking-wider text-rose-400 hover:text-rose-300 transition py-1 px-2 rounded hover:bg-rose-500/10">
                    <i class="fa-solid fa-trash-can mr-1"></i> Limpiar todo
                </button>
            </div>

            <div id="lista-misa" class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar min-h-[150px] bg-[#1a1a1a]/50 rounded-xl p-2 border border-dashed border-gray-800">
                </div>

            <div class="mt-4 pt-4 border-t border-gray-800">
                <button onclick="generarPowerPoint()" class="w-full bg-[#FFCC00] hover:bg-[#e6b800] text-black py-4 rounded-xl text-base font-black uppercase tracking-wider transition duration-200 shadow-lg shadow-[#FFCC00]/10 active:scale-[0.98] flex items-center justify-center gap-3">
                    <i class="fa-solid fa-file-powerpoint text-xl"></i> Generar Presentación PPTX
                </button>
            </div>
        </section>
    </main>

    <div id="modal-canto" class="fixed inset-0 bg-black/80 z-50 hidden backdrop-blur-sm flex items-center justify-center p-3">
        <div class="bg-[#141414] border border-gray-800 rounded-2xl w-full max-w-lg shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h3 id="modal-titulo-accion" class="text-lg font-bold text-white">Agregar Canto Nuevo</h3>
                <button onclick="cerrarModal()" class="text-gray-400 hover:text-white p-1 text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-4 space-y-4 overflow-y-auto flex-1">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Título del Canto</label>
                    <input type="text" id="form-titulo" class="w-full bg-[#1c1c1c] border border-gray-700 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-[#FFCC00]">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Categoría Litúrgica</label>
                    <select id="form-categoria" class="w-full bg-[#1c1c1c] border border-gray-700 rounded-xl px-4 py-3 text-base text-white focus:outline-none focus:border-[#FFCC00]">
                        <option value="entrada">Entrada</option>
                        <option value="penitencial">Acto Penitencial</option>
                        <option value="gloria">Gloria</option>
                        <option value="meditacion">Salmo / Meditación</option>
                        <option value="aleluya">Aleluya / Secuencia</option>
                        <option value="ofertorio">Ofertorio</option>
                        <option value="santo">Santo</option>
                        <option value="paz">Paz</option>
                        <option value="comunion">Comunión</option>
                        <option value="salida">Acción de Gracias / Salida</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-1">Letra (Usa doble intro para cambiar de diapositiva)</label>
                    <textarea id="form-letra" rows="8" class="w-full bg-[#1c1c1c] border border-gray-700 rounded-xl p-4 text-base text-white focus:outline-none focus:border-[#FFCC00] font-mono" placeholder="Estrofa 1&#10;&#10;Estrofa 2..."></textarea>
                </div>
            </div>

            <div class="p-4 border-t border-gray-800 bg-[#1a1a1a] flex gap-3 rounded-b-2xl">
                <button onclick="cerrarModal()" class="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-3 rounded-xl font-bold text-sm transition">Cancelar</button>
                <button onclick="guardarCantoProcesar()" class="flex-1 bg-[#FFCC00] hover:bg-[#e6b800] text-black py-3 rounded-xl font-bold text-sm transition">Guardar Canto</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 z-40 lg:bottom-8 lg:right-8">
        <button onclick="abrirModalNuevo()" class="bg-[#FFCC00] hover:bg-[#e6b800] text-black w-14 h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center shadow-2xl shadow-[#FFCC00]/20 transition transform hover:scale-105 active:scale-95">
            <i class="fa-solid fa-plus text-xl md:text-2xl"></i>
        </button>
    </div>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #2c2c2c; rounded: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #444; }
    </style>

    <script>
        let cantoral = [];
        let ordenMisa = [];
        let editandoId = null;

        window.addEventListener('DOMContentLoaded', () => {
            // Cargar datos iniciales saltando caché
            fetch('cantos.txt?v=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    cantoral = data;
                    renderizarCantoral();
                })
                .catch(err => {
                    console.log("Creando base de datos vacía");
                    cantoral = [];
                    renderizarCantoral();
                });
        });

        function renderizarCantoral() {
            const container = document.getElementById('lista-cantos');
            container.innerHTML = '';
            
            if(cantoral.length === 0) {
                container.innerHTML = `<div class="text-gray-500 text-center p-6 text-sm italic">No hay cantos en el archivo. ¡Crea uno nuevo abajo a la derecha!</div>`;
                return;
            }

            cantoral.forEach(canto => {
                const div = document.createElement('div');
                div.className = "bg-[#1c1c1c] border border-gray-800 p-3 rounded-xl flex justify-between items-center gap-2 hover:border-gray-700 transition";
                div.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="agregarAMisa('${canto.id}')" style="cursor: pointer;">
                        <h3 class="text-base font-bold text-white truncate">${canto.titulo}</h3>
                        <span class="inline-block text-[10px] font-black uppercase tracking-wider text-[#FFCC00] bg-[#FFCC00]/10 px-2 py-0.5 rounded mt-1">${canto.categoria}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="abrirModalEditar('${canto.id}')" class="p-2 text-gray-400 hover:text-[#FFCC00] text-base transition" title="Editar canto"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="eliminarDelCantoral('${canto.id}')" class="p-2 text-gray-500 hover:text-rose-400 text-base transition" title="Eliminar del cantoral"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filtrarCantos() {
            const termino = document.getElementById('buscador').value.toLowerCase();
            const todosLosDivs = document.getElementById('lista-cantos').children;

            cantoral.forEach((canto, index) => {
                const coincide = canto.titulo.toLowerCase().includes(termino) || canto.letra.toLowerCase().includes(termino);
                if (todosLosDivs[index] && todosLosDivs[index].style) {
                    todosLosDivs[index].style.display = coincide ? "flex" : "none";
                }
            });
        }

        function agregarAMisa(id) {
            const canto = cantoral.find(c => c.id === id);
            if(canto) {
                ordenMisa.push({...canto, misaId: 'm-' + Date.now() + Math.random().toString(36).substr(2, 4)});
                renderizarMisa();
                document.getElementById('lista-misa').scrollTop = document.getElementById('lista-misa').scrollHeight;
            }
        }

        function renderizarMisa() {
            const container = document.getElementById('lista-misa');
            container.innerHTML = '';

            if(ordenMisa.length === 0) {
                container.innerHTML = `<div class="text-gray-500 text-center p-8 text-sm italic">Selecciona cantos de la lista izquierda para estructurar la liturgia dominical.</div>`;
                return;
            }

            ordenMisa.forEach((canto, index) => {
                const div = document.createElement('div');
                div.className = "bg-[#222] border border-gray-700 p-3 rounded-xl flex justify-between items-center gap-2 shadow-inner";
                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Puesto #${index + 1} — ${canto.categoria}</span>
                        <h3 class="text-base font-bold text-white truncate">${canto.titulo}</h3>
                    </div>
                    <div class="flex items-center gap-0.5">
                        <button onclick="moverMisa(${index}, -1)" class="p-2 text-gray-400 hover:text-white transition" ${index === 0 ? 'disabled style="opacity:0.2;"' : ''}><i class="fa-solid fa-arrow-up"></i></button>
                        <button onclick="moverMisa(${index}, 1)" class="p-2 text-gray-400 hover:text-white transition" ${index === ordenMisa.length - 1 ? 'disabled style="opacity:0.2;"' : ''}><i class="fa-solid fa-arrow-down"></i></button>
                        <button onclick="eliminarDeMisa('${canto.misaId}')" class="p-2 text-gray-500 hover:text-rose-400 text-lg transition ml-1"><i class="fa-solid fa-circle-xmark"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function moverMisa(index, direccion) {
            const destino = index + direccion;
            if(destino >= 0 && destino < ordenMisa.length) {
                const temp = ordenMisa[index];
                ordenMisa[index] = ordenMisa[destino];
                ordenMisa[destino] = temp;
                renderizarMisa();
            }
        }

        function eliminarDeMisa(misaId) {
            ordenMisa = ordenMisa.filter(c => canto.misaId !== misaId);
            renderizarMisa();
        }

        function limpiarMisa() {
            if(confirm("¿Seguro que quieres vaciar el orden de la misa?")) {
                ordenMisa = [];
                renderizarMisa();
            }
        }

        function eliminarDelCantoral(id) {
            if(confirm("¿Seguro que deseas eliminar permanentemente este canto del archivo?")) {
                cantoral = cantoral.filter(c => c.id !== id);
                renderizarCantoral();
            }
        }

        // MODAL LOGIC
        function abrirModalNuevo() {
            editandoId = null;
            document.getElementById('modal-titulo-accion').innerText = "Agregar Canto Nuevo";
            document.getElementById('form-titulo').value = '';
            document.getElementById('form-categoria').value = 'entrada';
            document.getElementById('form-letra').value = '';
            document.getElementById('modal-canto').classList.remove('hidden');
        }

        function abrirModalEditar(id) {
            const canto = cantoral.find(c => c.id === id);
            if(canto) {
                editandoId = id;
                document.getElementById('modal-titulo-accion').innerText = "Editar Canto";
                document.getElementById('form-titulo').value = canto.titulo;
                document.getElementById('form-categoria').value = canto.categoria;
                document.getElementById('form-letra').value = canto.letra;
                document.getElementById('modal-canto').classList.remove('hidden');
            }
        }

        function cerrarModal() {
            document.getElementById('modal-canto').classList.add('hidden');
        }

        function guardarCantoProcesar() {
            const titulo = document.getElementById('form-titulo').value.trim();
            const categoria = document.getElementById('form-categoria').value;
            const letra = document.getElementById('form-letra').value.trim();

            if(!titulo || !letra) {
                alert("Por favor, rellena el título y la letra del canto.");
                return;
            }

            if(editandoId) {
                // Editar existente
                const index = cantoral.findIndex(c => c.id === editandoId);
                if(index !== -1) {
                    cantoral[index] = { id: editandoId, titulo, categoria, letra };
                }
            } else {
                // Crear nuevo
                const nuevo = {
                    id: 'c-' + Date.now(),
                    titulo,
                    categoria,
                    letra
                };
                cantoral.push(nuevo);
            }

            renderizarCantoral();
            cerrarModal();
        }

        // CONTROL DE ARCHIVOS
        function guardarCantosTxt() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cantoral, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "cantos.txt");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importarCantosExterno() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = readerEvent => {
                    try {
                        const contenido = JSON.parse(readerEvent.target.result);
                        if(Array.isArray(contenido)) {
                            cantoral = contenido;
                            renderizarCantoral();
                            alert("¡Cantoral importado con éxito!");
                        } else {
                            alert("El archivo no tiene el formato JSON de cantos correcto.");
                        }
                    } catch(err) {
                        alert("Error al procesar el archivo. Asegúrate de que es un cantos.txt generado por esta aplicación.");
                    }
                }
                reader.readAsText(file,'UTF-8');
            }
            input.click();
        }

        // MOTOR POWERPOINT (Misma estética Archidiócesis pero adaptada)
        function generarPowerPoint() {
            if(ordenMisa.length === 0) {
                alert("Agrega primero cantos al Orden de la Misa para exportar.");
                return;
            }

            let pptx = new PptxGenJS();
            pptx.layout = 'LAYOUT_16x9';

            ordenMisa.forEach(canto => {
                // Separar estrofas por doble salto de línea
                const estrofas = canto.letra.split(/\n\s*\n/);
                
                estrofas.forEach((estrofaText, i) => {
                    let slide = pptx.addSlide();
                    // Fondo negro oficial
                    slide.background = { fill: '0C0C0C' };

                    // Etiqueta superior sutil (Categoría + Parte)
                    slide.addText(`${canto.titulo.toUpperCase()} (${canto.categoria.toUpperCase()}) — ${i+1}/${estrofas.length}`, {
                        x: 0.5, y: 0.4, w: 12.3, h: 0.4,
                        fontSize: 14, fontFace: 'Arial', color: 'FFCC00',
                        bold: true, tracking: 2, align: 'left'
                    });

                    // Bloque de la Letra centralizado e imponente
                    slide.addText(estrofaText.trim(), {
                        x: 0.8, y: 1.2, w: 11.7, h: 5.2,
                        fontSize: 34, fontFace: 'Calibri', color: 'FFFFFF',
                        bold: true, align: 'center', valign: 'middle',
                        lineSpacing: 42
                    });
                });
            });

            pptx.writeFile({ fileName: `Misa_Coro_MCLE_${new Date().toISOString().slice(0,10)}` });
        }
    </script>
</body>
</html>
