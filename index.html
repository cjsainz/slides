<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestor slides coro MCLE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFCC00">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // ⚠️ REEMPLAZA ESTE BLOQUE CON TUS CLAVES REALES DE FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyAl5BGrajS3msFrzsHvJ6hBau_WHLt43Rg",
  authDomain: "letras-slides-coro-mcle.firebaseapp.com",
  projectId: "letras-slides-coro-mcle",
  storageBucket: "letras-slides-coro-mcle.firebasestorage.app",
  messagingSenderId: "254122067309",
  appId: "1:254122067309:web:1037bc0bf0397ce2f30664",
  measurementId: "G-DTE3G8GZ25"
};

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      const cantosRef = collection(db, "cantos");

      window.dbCloud = { db, cantosRef, onSnapshot, doc, setDoc, deleteDoc };
    </script>

    <style>
        :root { --accent-color: #FFCC00; --bg-dark: #0c0c0c; --border-color: #262626; }
        body { background-color: var(--bg-dark); color: #f3f3f3; font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Montserrat', sans-serif; }
        .slide-preview { background-color: #000; aspect-ratio: 16 / 9; box-shadow: 0 20px 40px rgba(0,0,0,0.8); border: 1px solid var(--border-color); position: relative; }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        
        /* Forzado de interfaces legibles en inputs */
        .form-select, .form-input { background-color: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 12px; width: 100%; outline: none; transition: all 0.2s; }
        .form-select:focus, .form-input:focus { border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(255,204,0,0.2); }
        
        /* Optimizaciones táctiles agresivas para móviles */
        @media (max-width: 1024px) {
            html { font-size: 16px; }
            .form-input, .form-select { font-size: 18px !important; padding: 14px 16px !important; }
            button { min-height: 48px; }
            /* Eliminamos el bloqueo sticky en móvil para evitar que las listas colapsen a mini-píxeles */
            .mobile-stack { position: relative !important; top: 0 !important; height: auto !important; max-height: none !important; }
        }
    </style>
</head>
<body class="min-h-screen pb-24">

    <header class="border-b border-neutral-800 bg-neutral-950/80 backdrop-blur-md py-4 px-4 sm:px-6 sticky top-0 z-50">
        <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 text-center sm:text-left flex-col sm:flex-row w-full lg:w-auto">
                <div class="text-3xl text-amber-500"><i class="fa-solid fa-cross"></i></div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white uppercase leading-none">Gestor slides coro MCLE</h1>
                    <p class="text-[10px] tracking-[0.15em] text-neutral-500 font-bold uppercase mt-1">Misión Española • Múnich</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-3 justify-center lg:justify-end w-full lg:w-auto">
                <div class="relative flex-1 min-w-[130px] sm:flex-none sm:w-44">
                    <label class="text-[9px] font-black uppercase text-neutral-400 absolute -top-2.5 left-2 bg-neutral-950 px-1 z-10">Nombre Misa</label>
                    <input type="text" id="pptx-filename" value="Misa_Domingo" oninput="actualizarPreview()" class="form-input px-3 py-2 text-sm font-bold">
                </div>
                <div class="relative flex-1 min-w-[100px] sm:flex-none sm:w-32">
                    <label class="text-[9px] font-black uppercase text-neutral-400 absolute -top-2.5 left-2 bg-neutral-950 px-1 z-10">Fecha</label>
                    <input type="text" id="pptx-date" oninput="actualizarPreview()" class="form-input px-3 py-2 text-sm font-bold text-center">
                </div>
                <button onclick="generarPowerPoint()" class="w-full sm:w-auto bg-[#FFCC00] hover:bg-amber-500 text-neutral-950 font-black px-6 py-3 rounded-xl flex items-center justify-center gap-2 text-sm shadow-xl active:scale-95 transition-all">
                    <i class="fa-solid fa-file-powerpoint text-base"></i> GENERAR PPTX
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-[1600px] mx-auto px-4 mt-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <section class="mobile-stack lg:col-span-4 xl:col-span-4 bg-neutral-900/40 border border-neutral-800 rounded-2xl p-4 flex flex-col h-[600px] lg:h-[calc(100vh-140px)] lg:sticky lg:top-24">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-base font-black text-white uppercase tracking-wide"><i class="fa-solid fa-cloud text-amber-500 mr-1"></i> Cantoral (<span id="total-cantos">0</span>)</h2>
                <button onclick="abrirModalNuevoCanto()" class="bg-amber-500 text-neutral-950 px-4 py-2 rounded-xl text-xs font-black active:scale-95 transition-all shadow-md shadow-amber-500/10">+ AÑADIR</button>
            </div>
            <div class="relative mb-3">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-neutral-500 text-base"></i>
                <input type="text" id="busqueda" oninput="filtrarBiblioteca()" placeholder="Buscar canto o letra..." class="w-full bg-black border border-neutral-800 rounded-xl pl-11 pr-4 py-3 text-base text-white outline-none">
            </div>
            <div class="flex-grow overflow-y-auto space-y-2 pr-1 custom-scroll" id="lista-biblioteca">
                <div class="text-neutral-500 text-sm text-center p-4 italic">Conectando a la nube...</div>
            </div>
        </section>

        <section class="lg:col-span-8 xl:col-span-8 flex flex-col gap-6">
            
            <div class="bg-neutral-900/40 border border-neutral-800 rounded-2xl p-4">
                <h3 class="text-xs font-black text-neutral-400 uppercase mb-3 tracking-wider"><i class="fa-solid fa-sliders text-amber-500 mr-1"></i> Tamaños en Diapositivas (PPTX)</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-center">
                    <div class="bg-black/60 p-3 rounded-xl border border-neutral-800/60">
                        <p class="text-[10px] font-black text-amber-500 mb-2 tracking-widest">PORTADA</p>
                        <div class="flex gap-2 mb-2">
                            <input type="number" id="size-cover-title" value="58" class="form-input text-center py-1.5" onchange="actualizarPreview()">
                            <input type="number" id="size-cover-sub" value="28" class="form-input text-center py-1.5" onchange="actualizarPreview()">
                        </div>
                        <select id="align-cover" class="form-select py-1.5" onchange="actualizarPreview()"><option value="center" selected>Centrado</option><option value="left">Izquierda</option></select>
                    </div>
                    <div class="bg-black/60 p-3 rounded-xl border border-neutral-800/60">
                        <p class="text-[10px] font-black text-amber-500 mb-2 tracking-widest">TÍTULOS</p>
                        <input type="number" id="size-song-title" value="42" class="form-input text-center py-1.5 mb-2" onchange="actualizarPreview()">
                        <select id="align-song-title" class="form-select py-1.5" onchange="actualizarPreview()"><option value="center" selected>Centrado</option><option value="left">Izquierda</option></select>
                    </div>
                    <div class="bg-black/60 p-3 rounded-xl border border-neutral-800/60">
                        <p class="text-[10px] font-black text-amber-500 mb-2 tracking-widest">LETRAS</p>
                        <input type="number" id="size-lyric-body" value="52" class="form-input text-center py-1.5 mb-2" onchange="actualizarPreview()">
                        <select id="align-lyric-body" class="form-select py-1.5" onchange="actualizarPreview()"><option value="center" selected>Centrado</option><option value="left">Izquierda</option></select>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 xl:grid-cols-2 gap-6">
                <div class="bg-neutral-900/40 border border-neutral-800 rounded-2xl p-4 h-[450px] flex flex-col">
                    <div class="flex justify-between items-center mb-3">
                        <h2 class="text-sm font-black text-white uppercase tracking-wide">Lista de Misa Dominicana</h2>
                        <button onclick="limpiarPrograma()" class="text-xs font-bold text-rose-400 bg-rose-500/10 px-3 py-1.5 rounded-lg border border-rose-500/20">VACIAR</button>
                    </div>
                    <div class="flex-grow overflow-y-auto space-y-2 pr-1 custom-scroll" id="lista-programa"></div>
                </div>
                
                <div class="bg-neutral-900/40 border border-neutral-800 rounded-2xl p-4 h-[450px] flex flex-col">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-sm font-black text-white uppercase tracking-wide"><i class="fa-solid fa-desktop text-amber-500 mr-1"></i> Monitor de Proyector</h3>
                        <div class="flex gap-1 items-center">
                            <button onclick="cambiarSlidePreview(-1)" class="w-10 h-10 rounded-xl bg-black border border-neutral-800 flex items-center justify-center active:scale-90"><i class="fa-solid fa-chevron-left text-sm"></i></button>
                            <span id="preview-contador" class="text-xs font-bold px-2 text-neutral-400">0/0</span>
                            <button onclick="cambiarSlidePreview(1)" class="w-10 h-10 rounded-xl bg-black border border-neutral-800 flex items-center justify-center active:scale-90"><i class="fa-solid fa-chevron-right text-sm"></i></button>
                        </div>
                    </div>
                    <div class="slide-preview rounded-xl flex-grow overflow-hidden flex flex-col justify-center p-4 text-center bg-black" id="preview-content"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="modal-canto" class="fixed inset-0 bg-black/95 backdrop-blur-md z-[100] flex items-center justify-center p-4 hidden overflow-y-auto">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-2xl rounded-2xl overflow-hidden my-auto shadow-2xl">
            <div class="px-5 py-4 border-b border-neutral-800 flex justify-between items-center">
                <h3 class="text-base font-black text-white uppercase tracking-wide">Editor de Canto (Nube Live)</h3>
                <button onclick="cerrarModalCanto()" class="text-neutral-400 hover:text-white text-2xl p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <input type="hidden" id="modal-canto-id">
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="text-[10px] font-black text-neutral-400 uppercase block mb-1">Liturgia / Categoría</label>
                        <select id="modal-input-categoria" class="form-select py-3 font-bold text-base">
                            <option value="entrada">Entrada</option><option value="piedad">Piedad</option><option value="gloria">Gloria</option><option value="salmo">Salmo</option>
                            <option value="aleluya">Aleluya</option><option value="credo">Credo</option><option value="ofertorio">Ofertorio</option><option value="santo">Santo</option>
                            <option value="cordero">Cordero</option><option value="comunion">Comunión</option><option value="postcomunion">Postcomunión</option><option value="aviso">Aviso</option><option value="salida">Salida</option>
                        </select>
                    </div>
                    <div class="sm:col-span-2">
                        <label class="text-[10px] font-black text-neutral-400 uppercase block mb-1">Título del Canto</label>
                        <div class="flex gap-2">
                            <input type="text" id="modal-input-titulo" class="form-input py-3 font-bold text-base flex-grow">
                            <button onclick="buscarLetraInternet()" class="bg-neutral-800 hover:bg-neutral-700 text-amber-500 px-4 rounded-xl border border-neutral-700 active:scale-95 flex items-center gap-2 font-bold text-sm shrink-0">
                                <i class="fa-solid fa-magnifying-glass text-base"></i> <span class="hidden sm:inline">BUSCAR</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-neutral-400 uppercase block mb-1">Letra (Usa un Doble Intro para separar entre diapositivas)</label>
                    <textarea id="modal-input-letra" rows="8" class="w-full bg-black border border-neutral-800 rounded-xl px-4 py-3 text-base sm:text-lg text-white font-sans outline-none leading-relaxed" placeholder="Escribe la letra aquí..."></textarea>
                </div>
            </div>
            <div class="bg-black/40 px-5 py-4 flex justify-between items-center gap-3">
                <button id="btn-eliminar-cloud" onclick="eliminarCantoCloud()" class="bg-rose-950/60 border border-rose-900 text-rose-400 font-bold px-4 py-3 rounded-xl text-xs uppercase hidden"><i class="fa-solid fa-trash mr-1"></i> Eliminar</button>
                <div class="flex gap-3 ml-auto w-full sm:w-auto">
                    <button onclick="cerrarModalCanto()" class="flex-1 sm:flex-none bg-neutral-800 text-neutral-300 font-bold px-5 py-3 rounded-xl text-xs uppercase">Cancelar</button>
                    <button onclick="guardarCanto()" class="flex-1 sm:flex-none bg-[#FFCC00] text-neutral-950 font-black px-6 py-3 rounded-xl text-xs uppercase shadow-lg shadow-amber-500/10">Guardar en Nube</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvasCategorias = { entrada:"Entrada", piedad:"Piedad", gloria:"Gloria", salmo:"Salmo", aleluya:"Aleluya", credo:"Credo", ofertorio:"Ofertorio", santo:"Santo", cordero:"Cordero", comunion:"Comunión", postcomunion:"Postcomunión", aviso:"Aviso", salida:"Salida" };
        let biblioteca = [], programa = [], previewIndex = 0, previewSlides = [], colapsados = {};

        function inicializarSincronizacionCloud() {
            if (!window.dbCloud) { setTimeout(inicializarSincronizacionCloud, 150); return; }
            const { cantosRef, onSnapshot } = window.dbCloud;
            onSnapshot(cantosRef, (snapshot) => {
                biblioteca = [];
                snapshot.forEach(doc => { biblioteca.push({ id: doc.id, ...doc.data() }); });
                actualizarBibliotecaUI();
            });
        }

        window.addEventListener('load', () => {
            const hoy = new Date();
            document.getElementById('pptx-date').value = `${String(hoy.getDate()).padStart(2,'0')}.${String(hoy.getMonth()+1).padStart(2,'0')}.${hoy.getFullYear()}`;
            Object.keys(canvasCategorias).forEach(cat => colapsados[cat] = false);
            inicializarSincronizacionCloud();
        });

        function buscarLetraInternet() {
            const titulo = document.getElementById('modal-input-titulo').value.trim();
            if (!titulo) return alert("Escribe primero el título.");
            window.open(`https://www.google.com/search?q=${encodeURIComponent(titulo + " letra canto catolico")}`, '_blank');
        }

        function renderizarBiblioteca(lista) {
            const container = document.getElementById('lista-biblioteca'); container.innerHTML = '';
            const grupos = {}; Object.keys(canvasCategorias).forEach(cat => grupos[cat] = []);
            lista.forEach(c => { if(grupos[c.categoria]) grupos[c.categoria].push(c); });
            document.getElementById('total-cantos').textContent = biblioteca.length;
            
            Object.keys(canvasCategorias).forEach(catKey => {
                let cantos = grupos[catKey]; if (cantos.length === 0) return;
                cantos.sort((a,b) => a.titulo.localeCompare(b.titulo,'es'));
                const isC = colapsados[catKey];
                
                const head = document.createElement('div');
                head.className = "text-xs font-black text-neutral-300 px-3 py-3.5 rounded-xl mt-2 border-l-4 border-amber-500 bg-neutral-900 flex justify-between items-center cursor-pointer select-none active:bg-neutral-800";
                head.onclick = () => { colapsados[catKey] = !colapsados[catKey]; renderizarBiblioteca(lista); };
                head.innerHTML = `<span>${canvasCategorias[catKey].toUpperCase()}</span><i class="fa-solid ${isC?'fa-chevron-right':'fa-chevron-down'} text-[10px] text-amber-500"></i>`;
                container.appendChild(head);
                
                if (!isC) cantos.forEach(c => {
                    const card = document.createElement('div');
                    card.className = "bg-neutral-950 border border-neutral-800/80 p-3.5 mb-1.5 rounded-xl flex justify-between items-center gap-3 cursor-pointer hover:border-neutral-600 active:bg-neutral-900";
                    card.onclick = () => agregarAlPrograma(c);
                    card.innerHTML = `
                        <div class="truncate text-[15px] font-bold text-neutral-200 flex-1 leading-snug">${c.titulo}</div>
                        <button onclick="abrirModalEditarCanto('${c.id}'); event.stopPropagation();" class="p-2.5 text-neutral-500 hover:text-amber-500 active:scale-90 shrink-0">
                            <i class="fa-solid fa-pen text-base"></i>
                        </button>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function guardarCanto() {
            const id = document.getElementById('modal-canto-id').value || "c-" + Date.now();
            const t = document.getElementById('modal-input-titulo').value.trim();
            const l = document.getElementById('modal-input-letra').value.trim();
            const c = document.getElementById('modal-input-categoria').value;
            if(!t || !l) return alert("Rellena título y letra");
            
            const { doc, setDoc, db } = window.dbCloud;
            setDoc(doc(db, "cantos", id), { titulo: t, letra: l, categoria: c })
                .then(() => { cerrarModalCanto(); })
                .catch(err => alert("Error en la nube: " + err));
        }

        function eliminarCantoCloud() {
            const id = document.getElementById('modal-canto-id').value;
            if(!id || !confirm("¿Eliminar este canto de la nube para siempre?")) return;
            const { doc, deleteDoc, db } = window.dbCloud;
            deleteDoc(doc(db, "cantos", id))
                .then(() => { cerrarModalCanto(); })
                .catch(err => alert("Error: " + err));
        }

        function filtrarBiblioteca() {
            const q = document.getElementById('busqueda').value.toLowerCase().trim();
            renderizarBiblioteca(biblioteca.filter(c => c.titulo.toLowerCase().includes(q) || c.letra.toLowerCase().includes(q)));
        }
        function actualizarBibliotecaUI() { filtrarBiblioteca(); }
        function agregarAlPrograma(c) { programa.push({...c, pId: Date.now()+Math.random()}); actualizarProgramaUI(); }
        function moverCanto(i, d) { const n = i+d; if(n>=0 && n<programa.length) { const temp = programa[i]; programa[i] = programa[n]; programa[n] = temp; actualizarProgramaUI(); } }
        function removerDelPrograma(i) { programa.splice(i,1); actualizarProgramaUI(); }
        function limpiarPrograma() { if(confirm("¿Vaciar lista?")) { programa = []; actualizarProgramaUI(); } }

        function actualizarProgramaUI() {
            const container = document.getElementById('lista-programa'); container.innerHTML = '';
            if (programa.length === 0) { container.innerHTML = `<div class="h-full flex items-center justify-center text-neutral-600 text-sm italic p-4">Ningún canto seleccionado aún.</div>`; return; }
            programa.forEach((c, i) => {
                const div = document.createElement('div');
                div.className = "bg-neutral-950 border border-neutral-800 p-3 rounded-xl flex justify-between items-center gap-2";
                div.innerHTML = `
                <div class="flex items-center gap-2 truncate flex-1">
                    <span class="text-[11px] font-black text-amber-500 bg-amber-500/10 px-2 py-1 rounded">#${i+1}</span>
                    <div class="truncate text-[14px] font-bold uppercase tracking-tight text-neutral-200">${c.titulo}</div>
                </div>
                <div class="flex gap-1 items-center shrink-0">
                    <button onclick="moverCanto(${i},-1)" class="p-2 text-neutral-400 hover:text-white"><i class="fa-solid fa-arrow-up text-sm"></i></button>
                    <button onclick="moverCanto(${i},1)" class="p-2 text-neutral-400 hover:text-white"><i class="fa-solid fa-arrow-down text-sm"></i></button>
                    <button onclick="removerDelPrograma(${i})" class="p-2 text-neutral-500 hover:text-rose-400 ml-1"><i class="fa-solid fa-xmark text-base"></i></button>
                </div>`;
                container.appendChild(div);
            });
            actualizarPreview();
        }

        function compilarSlides() {
            const l = [{ tipo:'portada', t: document.getElementById('pptx-filename').value.toUpperCase(), f: document.getElementById('pptx-date').value }];
            programa.forEach(c => {
                c.letra.replace(/\r\n/g,'\n').trim().split(/\n\n+/).forEach((txt, i) => l.push({ tipo:'canto', cT: c.titulo, txt: txt.trim(), esP: (i===0) }));
                l.push({ tipo:'negro' });
            });
            return l;
        }

        function actualizarPreview() {
            previewSlides = compilarSlides(); const content = document.getElementById('preview-content');
            if (previewSlides.length === 0) { document.getElementById('preview-contador').textContent = "0/0"; content.innerHTML = ""; return; }
            if (previewIndex >= previewSlides.length) previewIndex = previewSlides.length-1;
            document.getElementById('preview-contador').textContent = `${previewIndex+1}/${previewSlides.length}`;
            const s = previewSlides[previewIndex]; content.innerHTML = '';
            if (s.tipo === 'portada') {
                const szT = document.getElementById('size-cover-title').value, szS = document.getElementById('size-cover-sub').value, al = document.getElementById('align-cover').value;
                content.innerHTML = `<div style="text-align:${al}; font-weight:bold; width: 100%;"><h2 style="font-size:${szT/2.5}px; color:#fff;">${s.t}</h2><p style="font-size:${szS/2.5}px; margin:4px 0; color:#fff;">${s.f}</p><p style="font-size:${szS/2.5}px; color:#aaa; font-weight:500;">Misión Católica de Lengua Española de Múnich</p></div>`;
            } else if (s.tipo === 'canto') {
                const szST = document.getElementById('size-song-title').value, szB = document.getElementById('size-lyric-body').value, alT = document.getElementById('align-song-title').value, alB = document.getElementById('align-lyric-body').value;
                content.innerHTML = `<div style="font-weight:bold; width:100%; height:100%; position:relative;">${s.esP?`<h3 style="font-size:${szST/4}px; color:#FFCC00; text-align:${alT}; position:absolute; top:5px; width:100%; left:0; text-transform:uppercase;">${s.cT}</h3>`:''}<div style="height:100%; display:flex; align-items:center; justify-content:center;"><p style="font-size:${szB/3.2}px; text-align:${alB}; width:100%; padding:0 20px; color:#fff; line-height:1.3;">${s.txt.replace(/\n/g,'<br>')}</p></div></div>`;
            } else content.innerHTML = `<div class="text-neutral-700 text-sm font-black uppercase tracking-widest">[ PANTALLA EN NEGRO ]</div>`;
        }

        function cambiarSlidePreview(d) { const n = previewIndex + d; if(n>=0 && n<previewSlides.length) { previewIndex = n; actualizarPreview(); } }
        function abrirModalNuevoCanto() { document.getElementById('modal-canto-id').value=""; document.getElementById('modal-input-titulo').value=""; document.getElementById('modal-input-letra').value=""; document.getElementById('btn-eliminar-cloud').classList.add('hidden'); document.getElementById('modal-canto').classList.remove('hidden'); }
        function abrirModalEditarCanto(id) { const c = biblioteca.find(x => x.id === id); if(c) { document.getElementById('modal-canto-id').value=c.id; document.getElementById('modal-input-titulo').value=c.titulo; document.getElementById('modal-input-letra').value=c.letra; document.getElementById('modal-input-categoria').value=c.categoria; document.getElementById('btn-eliminar-cloud').classList.remove('hidden'); document.getElementById('modal-canto').classList.remove('hidden'); } }
        function cerrarModalCanto() { document.getElementById('modal-canto').classList.add('hidden'); }

        function generarPowerPoint() {
            if (programa.length === 0) return;
            let pptx = new PptxGenJS(); pptx.defineLayout({ name:'W', width:13.33, height:7.5 }); pptx.layout='W';
            const slides = compilarSlides(), szCT = parseInt(document.getElementById('size-cover-title').value), szCS = parseInt(document.getElementById('size-cover-sub').value), szST = parseInt(document.getElementById('size-song-title').value), szLB = parseInt(document.getElementById('size-lyric-body').value);
            const alC = document.getElementById('align-cover').value, alST = document.getElementById('align-song-title').value, alLB = document.getElementById('align-lyric-body').value;
            slides.forEach(slide => {
                let s = pptx.addSlide(); s.background = { color: '000000' };
                if (slide.tipo === 'portada') {
                    s.addText(slide.t, { x:0, y:1.8, w:'100%', align:alC, fontFace:'Arial', fontSize:szCT, bold:true, color:'FFFFFF' });
                    s.addText(slide.f, { x:0, y:3.2, w:'100%', align:alC, fontFace:'Arial', fontSize:szCS, bold:true, color:'FFFFFF' });
                    s.addText("Misión Católica de Lengua Española de Múnich\nArchidiócesis de Múnich y Freising", { x:0, y:4.5, w:'100%', align:alC, fontFace:'Arial', fontSize:szCS, bold:true, color:'FFFFFF' });
                } else if (slide.tipo === 'canto') {
                    if (slide.esP) s.addText(slide.cT.toUpperCase(), { x:0.2, y:0.1, w:12.93, h:0.8, align:alST, valign:'top', fontFace:'Arial', fontSize:szST, bold:true, color:'FFCC00' });
                    s.addText(slide.txt.trim(), { x:0.5, y:slide.esP?1.0:0.2, w:12.33, h:slide.esP?6.49:7.29, align:alLB, valign:'middle', fontFace:'Arial', fontSize:szLB, bold:true, color:'FFFFFF' });
                }
            });
            pptx.writeFile({ fileName: (document.getElementById('pptx-filename').value || "Misa") + ".pptx" });
        }
    </script>
