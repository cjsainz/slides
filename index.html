<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Gestor Slides Coro MCLE</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFCC00">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>

    <style>
        html, body {
            font-size: 18px !important; /* Agranda la letra base de toda la app */
            background-color: #0c0c0c !important;
        }
        input, select, textarea {
            font-size: 18px !important; /* Evita que el móvil haga zoom raro al escribir */
            padding: 14px !important;
        }
        button {
            padding-top: 12px !important;
            padding-bottom: 12px !important;
            font-weight: bold !important;
        }
        /* Ajuste para que en pantallas móviles se vea todo en una sola columna gigante */
        @media (max-width: 768px) {
            main {
                grid-template-cols: 1fr !important;
                display: flex !important;
                flex-direction: column !important;
                padding: 10px !important;
            }
            .text-xl { font-size: 1.5rem !important; }
            .text-lg { font-size: 1.3rem !important; }
            .text-base { font-size: 1.1rem !important; }
            .text-sm { font-size: 1rem !important; }
        }
    </style>
</head>
<body class="text-gray-100 min-h-screen font-sans antialiased pb-24">

    <header class="bg-[#141414] border-b border-gray-800 p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 w-full sm:w-auto justify-center sm:justify-start">
                <div class="bg-[#FFCC00] text-black p-3 rounded-xl">
                    <i class="fa-solid fa-cross text-2xl"></i>
                </div>
                <div class="text-center sm:text-left">
                    <h1 class="text-2xl font-black text-white">CORO MCLE</h1>
                    <p class="text-xs font-bold uppercase tracking-widest text-[#FFCC00]">Gestor de Slides • Múnich</p>
                </div>
            </div>
            
            <div class="flex gap-2 w-full sm:w-auto justify-center">
                <button onclick="importarCantosExterno()" class="bg-gray-800 hover:bg-gray-700 text-gray-200 px-4 py-3 rounded-xl text-sm border border-gray-700 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-file-import"></i> Importar
                </button>
                <button onclick="guardarCantosTxt()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-3 rounded-xl text-sm shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <section class="lg:col-span-5 bg-[#141414] rounded-2xl border border-gray-800 p-4 shadow-xl flex flex-col">
            <div class="mb-4">
                <h2 class="text-xl font-bold text-white mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-book text-[#FFCC00]"></i> Cantoral de la Misión
                </h2>
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                    <input type="text" id="buscador" oninput="filtrarCantos()" placeholder="Buscar por título o letra..." class="w-full bg-[#1c1c1c] border border-gray-700 rounded-xl pl-11 pr-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-[#FFCC00]">
                </div>
            </div>

            <div id="lista-cantos" class="space-y-3 min-h-[200px]">
                </div>
        </section>

        <section class="lg:col-span-7 bg-[#141414] rounded-2xl border border-gray-800 p-4 shadow-xl flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-[#FFCC00]"></i> Orden de la Misa
                </h2>
                <button onclick="limpiarMisa()" class="text-sm font-bold text-rose-400 py-1 px-2 rounded hover:bg-rose-500/10">
                    <i class="fa-solid fa-trash-can mr-1"></i> Limpiar
                </button>
            </div>

            <div id="lista-misa" class="space-y-3 min-h-[200px] bg-[#1a1a1a] rounded-xl p-3 border border-dashed border-gray-800">
                </div>

            <div class="mt-6 pt-4 border-t border-gray-800">
                <button onclick="generarPowerPoint()" class="w-full bg-[#FFCC00] hover:bg-[#e6b800] text-black py-4 rounded-xl text-lg font-black uppercase tracking-wider flex items-center justify-center gap-3 shadow-lg">
                    <i class="fa-solid fa-file-powerpoint text-xl"></i> Generar Presentación PPTX
                </button>
            </div>
        </section>
    </main>

    <div id="modal-canto" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-[#141414] border border-gray-800 rounded-2xl w-full max-w-lg shadow-2xl my-auto">
            <div class="p-4 border-b border-gray-800 flex justify-between items-center">
                <h3 id="modal-titulo-accion" class="text-xl font-bold text-white">Agregar Canto</h3>
                <button onclick="cerrarModal()" class="text-gray-400 text-2xl p-2"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="p-4 space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-1">Título del Canto</label>
                    <input type="text" id="form-titulo" class="w-full bg-[#1c1c1c] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-1">Categoría</label>
                    <select id="form-categoria" class="w-full bg-[#1c1c1c] border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none">
                        <option value="entrada">Entrada</option>
                        <option value="penitencial">Acto Penitencial</option>
                        <option value="gloria">Gloria</option>
                        <option value="meditacion">Salmo / Meditación</option>
                        <option value="aleluya">Aleluya / Secuencia</option>
                        <option value="ofertorio">Ofertorio</option>
                        <option value="santo">Santo</option>
                        <option value="paz">Paz</option>
                        <option value="comunion">Comunión</option>
                        <option value="salida">Acción de Gracias / Salida</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-1">Letra (Doble intro para nueva diapositiva)</label>
                    <textarea id="form-letra" rows="6" class="w-full bg-[#1c1c1c] border border-gray-700 rounded-xl p-4 text-white focus:outline-none" placeholder="Estrofa 1..."></textarea>
                </div>
            </div>

            <div class="p-4 border-t border-gray-800 bg-[#1a1a1a] flex gap-3 rounded-b-2xl">
                <button onclick="cerrarModal()" class="flex-1 bg-gray-800 text-gray-300 py-3 rounded-xl font-bold transition">Cancelar</button>
                <button onclick="guardarCantoProcesar()" class="flex-1 bg-[#FFCC00] text-black py-3 rounded-xl font-bold transition">Guardar</button>
            </div>
        </div>
    </div>

    <div class="fixed bottom-6 right-6 z-40">
        <button onclick="abrirModalNuevo()" class="bg-[#FFCC00] text-black w-16 h-16 rounded-full flex items-center justify-center shadow-2xl transform active:scale-95">
            <i class="fa-solid fa-plus text-2xl"></i>
        </button>
    </div>

    <script>
        let cantoral = [];
        let ordenMisa = [];
        let editandoId = null;

        window.addEventListener('DOMContentLoaded', () => {
            fetch('cantos.txt?v=' + Date.now())
                .then(res => res.json())
                .then(data => {
                    cantoral = data;
                    renderizarCantoral();
                })
                .catch(err => {
                    cantoral = [];
                    renderizarCantoral();
                });
        });

        function renderizarCantoral() {
            const container = document.getElementById('lista-cantos');
            container.innerHTML = '';
            
            if(cantoral.length === 0) {
                container.innerHTML = `<div class="text-gray-500 text-center p-6 text-sm italic">No hay cantos en el archivo.</div>`;
                return;
            }

            cantoral.forEach(canto => {
                const div = document.createElement('div');
                div.className = "bg-[#1c1c1c] border border-gray-800 p-4 rounded-xl flex justify-between items-center gap-3";
                div.innerHTML = `
                    <div class="flex-1 min-w-0" onclick="agregarAMisa('${canto.id}')" style="cursor: pointer; padding: 4px 0;">
                        <h3 class="text-lg font-bold text-white truncate">${canto.titulo}</h3>
                        <span class="inline-block text-xs font-bold uppercase tracking-wider text-[#FFCC00] bg-[#FFCC00]/10 px-2 py-1 rounded mt-1">${canto.categoria}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="abrirModalEditar('${canto.id}')" class="p-3 text-gray-400 hover:text-[#FFCC00] text-lg"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="eliminarDelCantoral('${canto.id}')" class="p-3 text-gray-500 hover:text-rose-400 text-lg"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filtrarCantos() {
            const termino = document.getElementById('buscador').value.toLowerCase();
            const todosLosDivs = document.getElementById('lista-cantos').children;

            cantoral.forEach((canto, index) => {
                const coincide = canto.titulo.toLowerCase().includes(termino) || canto.letra.toLowerCase().includes(termino);
                if (todosLosDivs[index]) todosLosDivs[index].style.display = coincide ? "flex" : "none";
            });
        }

        function agregarAMisa(id) {
            const canto = cantoral.find(c => c.id === id);
            if(canto) {
                ordenMisa.push({...canto, misaId: 'm-' + Date.now() + Math.random().toString(36).substr(2, 4)});
                renderizarMisa();
            }
        }

        function renderizarMisa() {
            const container = document.getElementById('lista-misa');
            container.innerHTML = '';

            if(ordenMisa.length === 0) {
                container.innerHTML = `<div class="text-gray-500 text-center p-8 text-sm italic">Toca un canto de la lista para añadirlo aquí.</div>`;
                return;
            }

            ordenMisa.forEach((canto, index) => {
                const div = document.createElement('div');
                div.className = "bg-[#222] border border-gray-700 p-4 rounded-xl flex justify-between items-center gap-2";
                div.innerHTML = `
                    <div class="flex-1 min-w-0">
                        <span class="text-xs font-bold text-gray-400 uppercase block mb-1">#${index + 1} — ${canto.categoria}</span>
                        <h3 class="text-lg font-bold text-white truncate">${canto.titulo}</h3>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="moverMisa(${index}, -1)" class="p-2 text-gray-400" ${index === 0 ? 'disabled style="opacity:0.1;"' : ''}><i class="fa-solid fa-arrow-up text-lg"></i></button>
                        <button onclick="moverMisa(${index}, 1)" class="p-2 text-gray-400" ${index === ordenMisa.length - 1 ? 'disabled style="opacity:0.1;"' : ''}><i class="fa-solid fa-arrow-down text-lg"></i></button>
                        <button onclick="eliminarDeMisa('${canto.misaId}')" class="p-2 text-rose-400 ml-1"><i class="fa-solid fa-circle-xmark text-xl"></i></button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function moverMisa(index, direccion) {
            const destino = index + direccion;
            if(destino >= 0 && destino < ordenMisa.length) {
                const temp = ordenMisa[index];
                ordenMisa[index] = ordenMisa[destino];
                ordenMisa[destino] = temp;
                renderizarMisa();
            }
        }

        function eliminarDeMisa(misaId) {
            ordenMisa = ordenMisa.filter(c => c.misaId !== misaId);
            renderizarMisa();
        }

        function limpiarMisa() {
            if(confirm("¿Vaciar la misa?")) {
                ordenMisa = [];
                renderizarMisa();
            }
        }

        function eliminarDelCantoral(id) {
            if(confirm("¿Eliminar del cantoral permanentemente?")) {
                cantoral = cantoral.filter(c => c.id !== id);
                renderizarCantoral();
            }
        }

        function abrirModalNuevo() {
            editandoId = null;
            document.getElementById('modal-titulo-accion').innerText = "Agregar Canto";
            document.getElementById('form-titulo').value = '';
            document.getElementById('form-categoria').value = 'entrada';
            document.getElementById('form-letra').value = '';
            document.getElementById('modal-canto').classList.remove('hidden');
        }

        function abrirModalEditar(id) {
            const canto = cantoral.find(c => c.id === id);
            if(canto) {
                editandoId = id;
                document.getElementById('modal-titulo-accion').innerText = "Editar Canto";
                document.getElementById('form-titulo').value = canto.titulo;
                document.getElementById('form-categoria').value = canto.categoria;
                document.getElementById('form-letra').value = canto.letra;
                document.getElementById('modal-canto').classList.remove('hidden');
            }
        }

        function cerrarModal() {
            document.getElementById('modal-canto').classList.add('hidden');
        }

        function guardarCantoProcesar() {
            const titulo = document.getElementById('form-titulo').value.trim();
            const categoria = document.getElementById('form-categoria').value;
            const letra = document.getElementById('form-letra').value.trim();

            if(!titulo || !letra) return;

            if(editandoId) {
                const index = cantoral.findIndex(c => c.id === editandoId);
                if(index !== -1) cantoral[index] = { id: editandoId, titulo, categoria, letra };
            } else {
                cantoral.push({ id: 'c-' + Date.now(), titulo, categoria, letra });
            }
            renderizarCantoral();
            cerrarModal();
        }

        function guardarCantosTxt() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(cantoral, null, 4));
            const a = document.createElement('a');
            a.setAttribute("href", dataStr);
            a.setAttribute("download", "cantos.txt");
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function importarCantosExterno() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.txt';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        cantoral = JSON.parse(ev.target.result);
                        renderizarCantoral();
                    } catch(err) { alert("Error de formato"); }
                }
                reader.readAsText(file,'UTF-8');
            }
            input.click();
        }

        function generarPowerPoint() {
            if(ordenMisa.length === 0) return;
            let pptx = new PptxGenJS();
            pptx.layout = 'LAYOUT_16x9';

            ordenMisa.forEach(canto => {
                const estrofas = canto.letra.split(/\n\s*\n/);
                estrofas.forEach((estrofaText, i) => {
                    let slide = pptx.addSlide();
                    slide.background = { fill: '0C0C0C' };
                    slide.addText(`${canto.titulo.toUpperCase()} (${canto.categoria.toUpperCase()}) — ${i+1}/${estrofas.length}`, {
                        x: 0.5, y: 0.4, w: 12.3, h: 0.4, fontSize: 14, fontFace: 'Arial', color: 'FFCC00', bold: true
                    });
                    slide.addText(estrofaText.trim(), {
                        x: 0.8, y: 1.2, w: 11.7, h: 5.2, fontSize: 34, fontFace: 'Calibri', color: 'FFFFFF', bold: true, align: 'center', valign: 'middle', lineSpacing: 42
                    });
                });
            });
            pptx.writeFile({ fileName: `Misa_MCLE` });
        }
    </script>
</body>
</html>
